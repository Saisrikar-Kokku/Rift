<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rift Floating Status Widget</title>
  <link rel="stylesheet" href="../shared/fonts.css">
  <style>
    /* ============================================================
       CRITICAL TRANSPARENCY & ZERO-SHADE STYLES:
       Compact canvas matching the native Tauri window.
       pointer-events: none ensures mouse clicks pass straight through
       any transparent canvas padding around the centered widget.
       STRICTLY INSET SHADOWS ONLY:
       Prevents any Windows Webview2 alpha-blending or rectangular shades.
       ============================================================ */
    html, body {
      background: transparent !important;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 6px;
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
    }

    /* ============================================================
       BASE WIDGET CONTAINER (#statusPill)
       Obsidian Dynamic Island floating capsule.
       Morphs seamlessly across all states with continuous 999px radius.
       ============================================================ */
    .pill {
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      pointer-events: none;
      cursor: grab;
      touch-action: none;
      background: #0b0b12; /* Deep Obsidian Surface */
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      box-shadow: 
        inset 0 1px 0 0 rgba(255, 255, 255, 0.16),
        inset 0 -1px 0 0 rgba(0, 0, 0, 0.50) !important;
      opacity: 0;
      transform: translateY(4px) scale(0.95);

      /* Phase 7: Performance — rendering isolation */
      contain: layout style paint;
      will-change: transform, opacity, width, height;

      /* Dynamic Island Liquid-Metal Spring Transition */
      transition: 
        width 280ms cubic-bezier(0.34, 1.56, 0.64, 1),
        height 280ms cubic-bezier(0.34, 1.56, 0.64, 1),
        border-color 200ms ease,
        background 200ms ease,
        opacity 200ms ease,
        transform 280ms cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .pill.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }

    .pill:active,
    .pill.dragging {
      cursor: grabbing !important;
      transform: scale(0.97) rotate(0.5deg);
    }

    .pill.position-locked {
      cursor: default !important;
    }

    /* Phase 6: Hover & Interaction — magnetic lift on idle hover */
    .pill.state-idle:hover {
      transform: translateY(-1px) scale(1.03);
      border-color: rgba(255, 255, 255, 0.14);
    }
    .pill.state-idle:hover .idle-wordmark {
      color: #ffffff;
    }
    .pill.state-idle:hover .idle-presence-dot {
      animation-duration: 1.2s;
    }

    /* ============================================================
       STATE 1: IDLE CAPSULE (Ultra-sleek 96x28px)
       ============================================================ */
    .pill.state-idle {
      width: 96px;
      height: 28px;
      border-radius: 999px;
      padding: 0 8px;
      background: #0b0b12;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* Phase 2: Ambient idle border glow — subtle breathing */
    .pill.state-idle.visible {
      animation: idleAmbientBorder 4s ease-in-out infinite alternate;
    }
    @keyframes idleAmbientBorder {
      0% { border-color: rgba(255, 255, 255, 0.06); }
      50% { border-color: rgba(129, 140, 248, 0.18); }
      100% { border-color: rgba(192, 132, 252, 0.14); }
    }

    /* ============================================================
       ACTIVE BASE & STATES (Height: 30px, continuous capsule)
       ============================================================ */
    .pill.state-active {
      height: 30px;
      border-radius: 999px;
      padding: 0 8px;
    }

    /* Active Recording State: 144px width */
    .pill.recording-active {
      width: 164px;
      border-color: rgba(139, 92, 246, 0.65);
      background: #0d0c18;
      box-shadow: 
        inset 0 1px 0 0 rgba(167, 139, 250, 0.25),
        inset 0 -1px 0 0 rgba(0, 0, 0, 0.50) !important;
      animation: recordingBorderPulse 2s ease-in-out infinite alternate !important;
    }

    /* Phase 2: Recording state ambient border pulse */
    @keyframes recordingBorderPulse {
      0% { border-color: rgba(139, 92, 246, 0.45); }
      100% { border-color: rgba(167, 139, 250, 0.85); }
    }

    /* Processing State: 138px width */
    .pill.state-processing-active {
      width: 138px;
      border-color: rgba(99, 102, 241, 0.65);
      background: linear-gradient(
        90deg,
        #0b0b14 0%,
        #16162a 50%,
        #0b0b14 100%
      );
      background-size: 200% 100%;
      animation: shimmerSweep 2.0s ease-in-out infinite;
      box-shadow: 
        inset 0 1px 0 0 rgba(129, 140, 248, 0.25),
        inset 0 -1px 0 0 rgba(0, 0, 0, 0.50) !important;
    }

    /* Enhancing State: 138px width */
    .pill.state-enhancing-active {
      width: 138px;
      border-color: rgba(168, 85, 247, 0.75) !important;
      background: linear-gradient(
        90deg,
        #0d0918 0%,
        #22123d 50%,
        #0d0918 100%
      ) !important;
      background-size: 200% 100% !important;
      animation: neuralSweep 1.6s ease-in-out infinite !important;
      box-shadow: 
        inset 0 1px 0 0 rgba(192, 132, 252, 0.3),
        inset 0 -1px 0 0 rgba(0, 0, 0, 0.50) !important;
    }

    @keyframes shimmerSweep {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    @keyframes neuralSweep {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Success Pill: 116px width */
    .pill.state-success-active {
      width: 116px;
      border-color: rgba(52, 211, 153, 0.65);
      background: #081410;
      box-shadow: 
        inset 0 1px 0 0 rgba(52, 211, 153, 0.25),
        inset 0 -1px 0 0 rgba(0, 0, 0, 0.50) !important;
      animation: successFlash 400ms ease-out !important;
    }

    /* Phase 4: Success border flash */
    @keyframes successFlash {
      0% { border-color: rgba(52, 211, 153, 1); }
      100% { border-color: rgba(52, 211, 153, 0.65); }
    }

    /* Warning Pill: 132px width */
    .pill.state-warning-active {
      width: 132px;
      border-color: rgba(251, 191, 36, 0.65);
      background: #141006;
      box-shadow: 
        inset 0 1px 0 0 rgba(251, 191, 36, 0.25),
        inset 0 -1px 0 0 rgba(0, 0, 0, 0.50) !important;
    }

    /* Error Pill: 132px width */
    .pill.state-error-active {
      width: 132px;
      border-color: rgba(239, 68, 68, 0.65);
      background: #160808;
      box-shadow: 
        inset 0 1px 0 0 rgba(239, 68, 68, 0.25),
        inset 0 -1px 0 0 rgba(0, 0, 0, 0.50) !important;
    }

    /* Retry Audio Recovery: 158px width */
    .pill.state-retry-active {
      width: 158px;
      border-color: rgba(245, 158, 11, 0.55) !important;
      background: #151108 !important;
      box-shadow: 
        inset 0 1px 0 0 rgba(245, 158, 11, 0.3),
        inset 0 -1px 0 0 rgba(0, 0, 0, 0.50) !important;
      animation: amberBreathe 2.8s ease-in-out infinite alternate !important;
      cursor: pointer !important;
    }

    .pill.state-retry-active:hover {
      border-color: rgba(245, 158, 11, 0.85) !important;
      transform: scale(1.02);
    }

    @keyframes amberBreathe {
      0% {
        border-color: rgba(245, 158, 11, 0.4);
      }
      100% {
        border-color: rgba(245, 158, 11, 0.8);
      }
    }

    /* ============================================================
       CONTENT LAYERS & CROSS-FADE
       ============================================================ */
    .badge-content {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 8px;
      box-sizing: border-box;
      opacity: 1;
      transform: scale(1);
      transition: opacity 140ms ease-out, transform 160ms ease-out;
      pointer-events: auto;
    }

    .active-content {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 8px;
      box-sizing: border-box;
      opacity: 0;
      transform: scale(0.92);
      transition: opacity 160ms ease-out, transform 180ms cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    .pill.state-idle .badge-content {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }
    .pill.state-idle .active-content {
      opacity: 0;
      transform: scale(0.92);
      pointer-events: none;
    }

    .pill.state-active .badge-content {
      opacity: 0;
      transform: scale(0.88);
      pointer-events: none;
    }
    .pill.state-active .active-content {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    /* ============================================================
       IDLE BADGE DETAILS
       16px Logo Chip + Wordmark + Glowing Presence Pip
       ============================================================ */
    .idle-logo-chip {
      position: relative;
      width: 16px;
      height: 16px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .idle-logo-svg {
      width: 16px;
      height: 16px;
      display: block;
    }

    .idle-wordmark {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 11px;
      font-weight: 600;
      color: #cbd5e1;
      letter-spacing: -0.01em;
      margin-left: 6px;
      line-height: 1;
      white-space: nowrap;
      transition: color 200ms ease;
    }

    .idle-presence-dot {
      width: 4.5px;
      height: 4.5px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 
        0 0 4px rgba(16, 185, 129, 0.6),
        0 0 8px rgba(16, 185, 129, 0.3);
      margin-left: 5px;
      flex-shrink: 0;
      animation: presenceBreathe 3s ease-in-out infinite alternate;
      transition: animation-duration 300ms ease;
    }

    @keyframes presenceBreathe {
      0% { opacity: 0.4; transform: scale(0.8); box-shadow: 0 0 3px rgba(16,185,129,0.4); }
      100% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 6px rgba(16,185,129,0.8), 0 0 12px rgba(16,185,129,0.3); }
    }

    /* Wrapper containing both the floating pill and the external dropdown */
    .widget-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      position: relative;
      width: 100%;
      pointer-events: none;
    }

    /* Dropdown Trigger Arrow Button */
    .dropdown-trigger-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 1px solid transparent;
      outline: none;
      padding: 0;
      width: 0;
      height: 16px;
      margin-left: 0;
      opacity: 0;
      cursor: pointer;
      color: #94a3b8;
      border-radius: 4px;
      overflow: hidden;
      pointer-events: none;
      flex-shrink: 0;
      transition: width 160ms cubic-bezier(0.16, 1, 0.3, 1),
                  opacity 160ms ease,
                  margin-left 160ms ease,
                  background 120ms ease,
                  border-color 120ms ease,
                  color 120ms ease,
                  transform 120ms ease;
    }

    /* Hovering over idle pill reveals the sleek chevron button */
    .pill.state-idle:hover .dropdown-trigger-btn,
    .pill.state-idle.dropdown-open .dropdown-trigger-btn,
    .widget-wrapper:hover .dropdown-trigger-btn {
      width: 16px;
      height: 16px;
      margin-left: 5px;
      opacity: 0.85;
      background: #1a1a27;
      border-color: #2b2b3d;
      color: #a5b4fc;
      pointer-events: auto;
    }

    .dropdown-trigger-btn:hover {
      opacity: 1 !important;
      color: #c084fc !important;
      background: #27193d !important;
      border-color: #6d4dc7 !important;
      transform: scale(1.08);
    }

    .dropdown-chevron-svg {
      width: 10px;
      height: 10px;
      display: block;
      transition: transform 180ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .pill.dropdown-open .dropdown-chevron-svg {
      transform: rotate(180deg);
      color: #c084fc;
    }

    /* Phase 3: Premium Frosted Glass Dropdown */
    .widget-dropdown-menu {
      box-sizing: border-box;
      width: 140px;
      margin-top: 6px;
      background: rgba(11, 11, 20, 0.88);
      backdrop-filter: blur(16px) saturate(160%);
      -webkit-backdrop-filter: blur(16px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 10px;
      padding: 3px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      box-shadow: 
        inset 0 1px 0 0 rgba(255, 255, 255, 0.14),
        inset 0 -1px 0 0 rgba(0, 0, 0, 0.5) !important;
      opacity: 0;
      transform: translateY(-6px) scale(0.92);
      pointer-events: none;
      transition: opacity 180ms ease-out, transform 220ms cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 1000;
    }

    .widget-dropdown-menu.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    /* Phase 3: Staggered menu item reveal */
    .widget-dropdown-menu .menu-action-item {
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity 100ms ease-out, transform 140ms cubic-bezier(0.34, 1.56, 0.64, 1), background 120ms ease, color 120ms ease;
    }
    .widget-dropdown-menu.open .menu-action-item:nth-child(1) { opacity: 1; transform: translateY(0); transition-delay: 20ms; }
    .widget-dropdown-menu.open .menu-action-item:nth-child(2) { opacity: 1; transform: translateY(0); transition-delay: 55ms; }
    .widget-dropdown-menu.open .menu-action-item:nth-child(3) { opacity: 1; transform: translateY(0); transition-delay: 90ms; }
    .widget-dropdown-menu.open .menu-action-item:nth-child(4) { opacity: 1; transform: translateY(0); transition-delay: 125ms; }

    .menu-action-item {
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 28px;
      padding: 0 7px;
      background: transparent;
      border: none;
      border-radius: 6px;
      color: #e2e8f0;
      font-family: inherit;
      cursor: pointer;
      transition: background 120ms ease, color 120ms ease, transform 90ms ease;
      user-select: none;
      -webkit-user-select: none;
      position: relative;
    }

    .menu-action-item:active {
      transform: scale(0.97);
    }

    .menu-action-item.retry-item:hover {
      background: rgba(245, 158, 11, 0.16) !important;
      color: #fef3c7 !important;
    }

    .menu-action-item.retry-item:hover .menu-item-hint {
      color: #fbbf24 !important;
    }

    .menu-item-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .menu-item-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .menu-item-icon svg {
      width: 12px;
      height: 12px;
    }

    .menu-item-label {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .menu-item-hint {
      font-size: 8.5px;
      color: #64748b;
      font-family: ui-monospace, SFMono-Regular, monospace;
    }

    .polish-item:hover {
      background: #241738;
      color: #f3e8ff;
    }
    .polish-item:hover .menu-item-icon svg {
      color: #c084fc;
    }
    .polish-item:hover .menu-item-hint {
      color: #d8b4fe;
    }

    .scratch-item:hover {
      background: #191c34;
      color: #e0e7ff;
    }
    .scratch-item:hover .menu-item-icon svg {
      color: #818cf8;
    }
    .scratch-item:hover .menu-item-hint {
      color: #a5b4fc;
    }

    .spotlight-item:hover {
      background: #251739;
      color: #f3e8ff;
    }
    .spotlight-item:hover .menu-item-icon svg {
      color: #c084fc;
    }
    .spotlight-item:hover .menu-item-hint {
      color: #e9d5ff;
    }

    /* ============================================================
       ACTIVE STATE VIEWS
       ============================================================ */
    .state-view {
      display: none;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 100%;
      color: #F1F5F9;
      box-sizing: border-box;
    }

    .state-view.active {
      display: flex;
    }

    /* ============================================================
       RECORDING STATE (GPU Waveform & Live Timer)
       ============================================================ */
    .mic-chip {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #7c5cfa;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 75ms ease-out;
    }

    .mic-icon-svg {
      width: 10px;
      height: 10px;
      color: #ffffff;
    }

    /* Phase 1: Enhanced 12-bar waveform with glow halo */
    .waveform-bars {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.8px;
      height: 18px;
      flex: 1;
      margin: 0 4px;
      position: relative;
    }

    /* Phase 1: Glow halo behind waveform bars */
    .waveform-bars::before {
      content: '';
      position: absolute;
      inset: -3px -6px;
      background: radial-gradient(ellipse at center, rgba(129,140,248,0.12) 0%, transparent 70%);
      border-radius: 999px;
      opacity: 0;
      transition: opacity 250ms ease;
      pointer-events: none;
    }
    .pill.recording-active .waveform-bars::before {
      opacity: 1;
      animation: waveGlowPulse 2.4s ease-in-out infinite alternate;
    }
    @keyframes waveGlowPulse {
      0% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    .wave-bar {
      width: 2px;
      height: 14px;
      min-height: 14px;
      background: linear-gradient(to top, #818cf8, #a78bfa, #c084fc);
      border-radius: 999px;
      transform: scaleY(0.15);
      transform-origin: center center;
      will-change: transform;
      /* Phase 7: Use rAF for updates, CSS transition only for idle reset */
      transition: transform 60ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .rec-indicator {
      display: flex;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
    }

    .rec-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #ef4444;
      animation: recPulse 1.2s ease-in-out infinite;
    }

    @keyframes recPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.8); }
    }

    .rec-timer {
      font-size: 9.5px;
      font-weight: 600;
      color: #f43f5e;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: 0.02em;
    }

    /* Key Dock badge adaptation */
    .key-dock-badge {
      display: none;
      align-items: center;
      justify-content: center;
      background: #1e1e2d;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 3px;
      padding: 1px 4px;
      font-size: 8px;
      font-weight: 700;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      flex-shrink: 0;
    }
    .pill.style-key_dock .key-dock-badge {
      display: inline-flex;
    }
    .pill.style-key_dock.recording-active .key-dock-badge {
      color: #fee2e2;
      background: #991b1b;
      border-color: #ef4444;
    }

    /* ============================================================
       PROCESSING STATE (Compact & Calm)
       ============================================================ */
    .processing-chip {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #18192a;
      border: 1px solid #4f46e5;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
    }

    /* Phase 5: Orbital processing dots */
    .orbital-dots {
      position: absolute;
      inset: -2px;
      animation: orbitalSpin 1.4s linear infinite;
    }
    .orbital-dot {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #818cf8;
    }
    .orbital-dot:nth-child(1) { top: -1px; left: 50%; transform: translateX(-50%); opacity: 1; }
    .orbital-dot:nth-child(2) { top: 50%; right: -1px; transform: translateY(-50%); opacity: 0.6; }
    .orbital-dot:nth-child(3) { bottom: -1px; left: 50%; transform: translateX(-50%); opacity: 0.3; }
    @keyframes orbitalSpin {
      to { transform: rotate(360deg); }
    }
    .pill.state-enhancing-active .orbital-dot { background: #c084fc; }

    .processing-spinner {
      width: 11px;
      height: 11px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .processing-text-wrapper {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-left: 6px;
      flex: 1;
      overflow: hidden;
    }

    .processing-text {
      color: #F1F5F9;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: -0.01em;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .processing-subtext {
      color: #a5b4fc;
      font-size: 8.5px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pill.state-enhancing-active .processing-chip {
      background: #2b1747;
      border-color: #a855f7;
    }

    .enhancing-sparkle {
      width: 12px;
      height: 12px;
      display: none;
      animation: sparklePulse 1.0s ease-in-out infinite;
    }

    .pill.state-enhancing-active .enhancing-sparkle {
      display: block;
    }

    .pill.state-enhancing-active .processing-spinner {
      display: none;
    }

    .pill.state-enhancing-active .processing-text {
      color: #faf5ff;
    }

    .pill.state-enhancing-active .processing-subtext {
      color: #d8b4fe;
    }

    @keyframes sparklePulse {
      0%, 100% {
        transform: scale(0.92) rotate(0deg);
        filter: drop-shadow(0 0 3px #a855f7);
      }
      50% {
        transform: scale(1.16) rotate(18deg);
        filter: drop-shadow(0 0 6px #c084fc);
      }
    }

    /* ============================================================
       SUCCESS, WARNING & ERROR STATES
       ============================================================ */
    .state-chip {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .state-chip.success {
      background: #064e3b;
      border: 1px solid #059669;
      color: #34d399;
    }

    .state-chip.warning {
      background: #451a03;
      border: 1px solid #d97706;
      color: #fbbf24;
    }

    .state-chip.error {
      background: #450a0a;
      border: 1px solid #dc2626;
      color: #ef4444;
    }

    .state-view.active .flourish-icon {
      animation: iconFlourish 280ms cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes iconFlourish {
      0% {
        opacity: 0;
        transform: scale(0.4) rotate(-8deg);
      }
      60% {
        opacity: 1;
        transform: scale(1.12) rotate(2deg);
      }
      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    /* Phase 4: Success check-draw animation */
    .state-chip.success svg polyline {
      stroke-dasharray: 24;
      stroke-dashoffset: 24;
    }
    .state-view.active .state-chip.success svg polyline {
      animation: checkStrokeDraw 350ms cubic-bezier(0.16, 1, 0.3, 1) 100ms forwards;
    }
    @keyframes checkStrokeDraw {
      0% { stroke-dashoffset: 24; }
      100% { stroke-dashoffset: 0; }
    }

    /* Phase 4: Success particle burst */
    .success-particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .success-particle {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #34d399;
      opacity: 0;
    }
    .state-view.active .success-particle {
      animation: particleBurst 500ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .success-particle:nth-child(1) { left: 50%; top: 50%; animation-delay: 50ms; --px: -8px; --py: -10px; }
    .success-particle:nth-child(2) { left: 50%; top: 50%; animation-delay: 80ms; --px: 10px; --py: -7px; }
    .success-particle:nth-child(3) { left: 50%; top: 50%; animation-delay: 110ms; --px: -6px; --py: 9px; }
    .success-particle:nth-child(4) { left: 50%; top: 50%; animation-delay: 60ms; --px: 8px; --py: 8px; }
    .success-particle:nth-child(5) { left: 50%; top: 50%; animation-delay: 100ms; --px: -11px; --py: 2px; }
    .success-particle:nth-child(6) { left: 50%; top: 50%; animation-delay: 90ms; --px: 12px; --py: -3px; }
    @keyframes particleBurst {
      0% { opacity: 1; transform: translate(0, 0) scale(1); }
      100% { opacity: 0; transform: translate(var(--px), var(--py)) scale(0.3); }
    }

    .state-text-wrapper {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-left: 6px;
      flex: 1;
      overflow: hidden;
    }

    .state-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 85px;
      line-height: 1.1;
    }

    .state-title.success { color: #34d399; }
    .state-title.warning { color: #fbbf24; }
    .state-title.error   { color: #f87171; }

    .state-chip.retry {
      width: 18px;
      height: 18px;
      background: #241604;
      border: 1px solid rgba(245, 158, 11, 0.45);
      color: #fbbf24;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .retry-text-wrapper {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-left: 6px;
      flex: 1;
      overflow: hidden;
      justify-content: center;
    }

    .state-title.retry {
      color: #fef3c7;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: -0.01em;
      line-height: 1.1;
    }

    .retry-action-tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(245, 158, 11, 0.16);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fef3c7;
      border-radius: 999px;
      padding: 2px 6px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.02em;
      margin-left: 5px;
      flex-shrink: 0;
      transition: all 140ms ease;
      white-space: nowrap;
    }

    .pill.state-retry-active:hover .retry-action-tag {
      background: rgba(245, 158, 11, 0.32);
      border-color: rgba(245, 158, 11, 0.75);
      color: #ffffff;
      transform: scale(1.04);
    }

    .state-subtitle {
      font-size: 8.5px;
      color: #94a3b8;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    /* Style variants: pill_text vs icon_color vs icon_mono */
    .pill.state-idle.style-icon_color,
    .pill.state-idle.style-icon_mono {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      padding: 0;
      justify-content: center;
    }
    .pill.state-idle.style-icon_color .idle-wordmark,

    .pill.state-idle.style-icon_color .idle-presence-dot,
    .pill.state-idle.style-icon_mono .idle-presence-dot {
      display: none;
    }
    .pill.style-icon_mono .idle-logo-chip svg {
      filter: grayscale(100%) opacity(0.85);
    }
  </style>

  <script src="../shared/qwebchannel.js"></script>

  <script>
    (function () {
      const statusPill = document.getElementById('statusPill');
      const views = {
        recording: document.getElementById('stateRecording'),
        processing: document.getElementById('stateProcessing'),
        success: document.getElementById('stateSuccess'),
        warning: document.getElementById('stateWarning'),
        error: document.getElementById('stateError'),
        retry: document.getElementById('stateRetry')
      };
      const retryActionTag = document.getElementById('retryActionTag');
      const retryLabel = document.getElementById('retryLabel');
      const btnRetryAudio = document.getElementById('btnRetryAudio');
      const warningLabel = document.getElementById('warningLabel');
      const errorLabel = document.getElementById('errorLabel');
      const successLabel = document.getElementById('successLabel');
      const micChip = document.getElementById('micChip');
      const recTimerEl = document.getElementById('recTimer');
      const waveBars = [
        document.getElementById('wb0'),
        document.getElementById('wb1'),
        document.getElementById('wb2'),
        document.getElementById('wb3'),
        document.getElementById('wb4'),
        document.getElementById('wb5'),
        document.getElementById('wb6'),
        document.getElementById('wb7'),
        document.getElementById('wb8'),
        document.getElementById('wb9'),
        document.getElementById('wb10'),
        document.getElementById('wb11')
      ];

      // Phase 1: 12-bar symmetric multipliers (tapered edges, peak center)
      const barMultipliers = [0.25, 0.4, 0.6, 0.8, 0.95, 1.0, 1.0, 0.95, 0.8, 0.6, 0.4, 0.25];

      // Phase 7: rAF-based audio rendering
      let pendingAudioLevel = null;
      let rafId = null;

      const keyDockBadge = document.getElementById('keyDockBadge');
      const processingTitle = document.getElementById('processingTitle');
      const processingModelLabel = document.getElementById('processingModelLabel');

      const widgetWrapper = document.getElementById('widgetWrapper');
      const widgetDropdownTrigger = document.getElementById('widgetDropdownTrigger');
      const widgetDropdownMenu = document.getElementById('widgetDropdownMenu');
      const btnPolish = document.getElementById('btnPolish');
      const btnScratchPad = document.getElementById('btnScratchPad');
      const btnSpotlight = document.getElementById('btnSpotlight');

      let isDropdownOpen = false;
      let dropdownHoverTimer = null;
      let dropdownDismissTimer = null;
      let recTimerInterval = null;
      let recSeconds = 0;

      function startRecTimer() {
        stopRecTimer();
        recSeconds = 0;
        if (recTimerEl) recTimerEl.textContent = '0:00';
        recTimerInterval = setInterval(() => {
          recSeconds++;
          const m = Math.floor(recSeconds / 60);
          const s = recSeconds % 60;
          if (recTimerEl) {
            recTimerEl.textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
          }
        }, 1000);
      }

      function stopRecTimer() {
        if (recTimerInterval) {
          clearInterval(recTimerInterval);
          recTimerInterval = null;
        }
        recSeconds = 0;
        if (recTimerEl) recTimerEl.textContent = '0:00';
      }

      function clearDropdownTimers() {
        if (dropdownHoverTimer) {
          clearTimeout(dropdownHoverTimer);
          dropdownHoverTimer = null;
        }
        if (dropdownDismissTimer) {
          clearTimeout(dropdownDismissTimer);
          dropdownDismissTimer = null;
        }
      }

      function closeDropdownMenu() {
        clearDropdownTimers();
        if (!isDropdownOpen) return;
        isDropdownOpen = false;
        statusPill.classList.remove('dropdown-open');
        if (widgetDropdownMenu) widgetDropdownMenu.classList.remove('open');
        try {
          if (window.rift && typeof window.rift.setWidgetDropdownOpen === 'function') {
            window.rift.setWidgetDropdownOpen(false);
          }
        } catch (e) {}
      }

      function openDropdownMenu() {
        clearDropdownTimers();
        if (currentState !== 'idle') return;
        isDropdownOpen = true;
        statusPill.classList.add('dropdown-open');
        if (widgetDropdownMenu) widgetDropdownMenu.classList.add('open');
        try {
          if (window.rift && typeof window.rift.setWidgetDropdownOpen === 'function') {
            window.rift.setWidgetDropdownOpen(true);
          }
        } catch (e) {}
      }

      function toggleDropdownMenu(e) {
        if (e) {
          e.stopPropagation();
          e.preventDefault();
        }
        if (isDropdownOpen) {
          closeDropdownMenu();
        } else {
          openDropdownMenu();
        }
      }

      class AcousticEarcons {
        constructor() {
          this.ctx = null;
          this.enabled = true;
          this.volume = 0.6;
        }

        ensureContext() {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
              this.ctx = new AudioCtx();
            }
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
          }
        }

        playTone(freqStart, freqEnd, type, durationMs, gainMax = 0.25) {
          return;
        }

        playRecordStart() {}
        playRecordStop() {}
        playSuccess() {}
        playCancel() {}
        playError() {}
      }

      const earcons = new AcousticEarcons();

      function getFriendlyModelName(modelId, provider) {
        if (!modelId && !provider) return 'Whisper Turbo';
        const m = (modelId || '').toLowerCase();
        const p = (provider || '').toLowerCase();

        if (m.includes('mai-transcribe-2') || m.includes('mai-transcribe')) return 'MAI-Transcribe 2';
        if (m.includes('gemini-2.5-flash') || m.includes('gemini')) return 'Gemini 2.5 Flash';
        if (m.includes('whisper-large-v3-turbo') || m.includes('turbo')) {
          return (p === 'groq' || m.startsWith('groq/')) ? 'Groq Turbo' : 'Whisper Turbo';
        }
        if (m.includes('whisper-large-v3')) {
          return (p === 'groq' || m.startsWith('groq/')) ? 'Groq Whisper' : 'Whisper Large';
        }
        if (p === 'groq' || m.startsWith('groq/')) return 'Groq Turbo';
        if (m.startsWith('local') || m.startsWith('offline') || p === 'local') return 'Local Whisper';
        if (modelId && modelId.includes('/')) {
          const parts = modelId.split('/');
          const last = parts[parts.length - 1];
          if (last.length > 16) return last.substring(0, 14) + '...';
          return last;
        }
        return modelId || 'Whisper Turbo';
      }

      function updateProcessingModel(modelStr, providerStr) {
        if (processingModelLabel) {
          processingModelLabel.textContent = getFriendlyModelName(modelStr, providerStr);
        }
      }

      function showEnhancingState(title, submodel) {
        if (processingTitle) processingTitle.textContent = title || 'Enhancing...';
        if (processingModelLabel) processingModelLabel.textContent = submodel || 'AI Polish';
        showState('enhancing');
      }

      function showTranscribingState(modelStr, providerStr) {
        if (processingTitle) processingTitle.textContent = 'Transcribing...';
        updateProcessingModel(modelStr, providerStr);
        showState('processing');
      }

      function showTransliteratingState(modelStr, providerStr) {
        if (processingTitle) processingTitle.textContent = 'Tenglish AI...';
        updateProcessingModel(modelStr, providerStr);
        showState('processing');
      }

      let widgetVisibility = 'always'; // 'always' | 'recording' | 'hidden'
      let currentWidgetStyle = 'active_waveform'; // 'active_waveform' | 'minimal_dot' | 'key_dock'
      let lockWidgetPosition = false;
      let currentState = 'idle';
      let autoDismissTimer = null;
      let safetyTimeoutTimer = null;

      function clearTimers() {
        if (autoDismissTimer) {
          clearTimeout(autoDismissTimer);
          autoDismissTimer = null;
        }
        if (safetyTimeoutTimer) {
          clearTimeout(safetyTimeoutTimer);
          safetyTimeoutTimer = null;
        }
      }

      function applyWidgetStyle(styleName) {
        if (!styleName) return;
        const normalized = styleName.toLowerCase().trim();
        if (['pill_text', 'icon_color', 'icon_mono', 'active_waveform', 'minimal_dot', 'key_dock'].includes(normalized)) {
          currentWidgetStyle = normalized;
        } else {
          currentWidgetStyle = 'pill_text';
        }

        statusPill.classList.remove('style-pill_text', 'style-icon_color', 'style-icon_mono', 'style-active_waveform', 'style-minimal_dot', 'style-key_dock');
        statusPill.classList.add(`style-${currentWidgetStyle}`);
      }

      function updateKeyDockLabel(cfg) {
        if (!cfg) return;
        let keyLabel = 'ALT';
        if (cfg.pushToTalkMode === 'combo') {
          keyLabel = (cfg.pushToTalkCombo || 'ctrl+win').toUpperCase();
        } else {
          let keyName = (cfg.pushToTalkKey || 'right alt').toUpperCase();
          keyLabel = keyName.replace('RIGHT ', '').replace('LEFT ', '');
        }
        if (keyDockBadge) keyDockBadge.textContent = keyLabel;
      }

      function isTransientActive() {
        return currentState && ['recording', 'processing', 'enhancing', 'success', 'warning', 'error', 'retry'].includes(currentState);
      }

      function showState(stateName) {
        clearTimers();
        if (stateName !== 'idle') {
          closeDropdownMenu();
        }
        currentState = stateName;

        if (widgetVisibility === 'hidden') {
          hidePillCompletely();
          return;
        }

        if (widgetVisibility === 'recording' && stateName === 'idle') {
          hidePillCompletely();
          return;
        }

        // Clean state classes
        statusPill.classList.remove(
          'recording-active',
          'state-processing-active',
          'state-enhancing-active',
          'state-success-active',
          'state-warning-active',
          'state-error-active',
          'state-retry-active'
        );

        if (stateName === 'idle') {
          stopRecTimer();
          statusPill.classList.remove('state-active');
          statusPill.classList.add('state-idle');
          resetWaveBars();
          if (micChip) micChip.style.transform = 'scale(1)';

          for (const viewEl of Object.values(views)) {
            if (viewEl) viewEl.classList.remove('active');
          }
        } else {
          statusPill.classList.remove('state-idle');
          statusPill.classList.add('state-active');

          if (stateName === 'recording') {
            statusPill.classList.add('recording-active');
            startRecTimer();
          } else {
            stopRecTimer();
            if (stateName === 'processing') {
              statusPill.classList.add('state-processing-active');
            } else if (stateName === 'enhancing') {
              statusPill.classList.add('state-enhancing-active');
            } else if (stateName === 'success') {
              statusPill.classList.add('state-success-active');
            } else if (stateName === 'warning') {
              statusPill.classList.add('state-warning-active');
            } else if (stateName === 'error') {
              statusPill.classList.add('state-error-active');
            } else if (stateName === 'retry') {
              statusPill.classList.add('state-retry-active');
            }
          }

          const activeKey = stateName === 'enhancing' ? 'processing' : stateName;
          for (const [key, viewEl] of Object.entries(views)) {
            if (viewEl) {
              if (key === activeKey) {
                viewEl.classList.add('active');
              } else {
                viewEl.classList.remove('active');
              }
            }
          }
        }

        // Smoothly ensure visible
        statusPill.classList.add('visible');

        // State dismissal and safety timeouts
        if (stateName === 'processing' || stateName === 'enhancing') {
          safetyTimeoutTimer = setTimeout(() => {
            transitionToIdleOrHide();
          }, 8000);
        } else if (stateName === 'success') {
          const dismissDelay = (successLabel && successLabel.textContent.includes('Ctrl+V')) ? 2000 : 750;
          autoDismissTimer = setTimeout(() => {
            transitionToIdleOrHide();
          }, dismissDelay);
        } else if (stateName === 'warning' || stateName === 'error') {
          autoDismissTimer = setTimeout(() => {
            transitionToIdleOrHide();
          }, 2800);
        } else if (stateName === 'retry') {
          autoDismissTimer = setTimeout(() => {
            transitionToIdleOrHide();
          }, 12000);
        }
      }

      function showRetryState(msg) {
        if (retryLabel) retryLabel.textContent = 'Audio Saved';
        showState('retry');
      }

      function transitionToIdleOrHide() {
        clearTimers();
        stopRecTimer();
        closeDropdownMenu();
        resetWaveBars();
        if (micChip) micChip.style.transform = 'scale(1)';

        if (widgetVisibility === 'always') {
          showState('idle');
        } else {
          hidePillCompletely();
        }
      }

      function hidePillCompletely() {
        clearTimers();
        stopRecTimer();
        closeDropdownMenu();
        currentState = null;
        resetWaveBars();
        if (micChip) micChip.style.transform = 'scale(1)';
        statusPill.classList.remove('visible');
        statusPill.classList.remove(
          'recording-active',
          'state-processing-active',
          'state-enhancing-active',
          'state-success-active',
          'state-warning-active',
          'state-error-active',
          'state-active'
        );
        for (const viewEl of Object.values(views)) {
          if (viewEl) viewEl.classList.remove('active');
        }
      }

      function resetWaveBars() {
        waveBars.forEach(bar => {
          if (bar) bar.style.transform = 'scaleY(0.15)';
        });
      }

      // Phase 7: Batch waveform updates into single rAF for 60fps GPU rendering
      function renderWaveFrame() {
        rafId = null;
        const level = pendingAudioLevel;
        pendingAudioLevel = null;

        if (!statusPill.classList.contains('visible') || currentState !== 'recording') return;
        if (level === null || level === undefined) return;

        if (level <= 1) {
          resetWaveBars();
          if (micChip) micChip.style.transform = 'scale(1)';
          return;
        }

        const factor = Math.min(1.0, Math.max(0, level / 65.0));

        if (micChip) {
          micChip.style.transform = `scale(${(1.0 + factor * 0.14).toFixed(3)})`;
        }

        // GPU-optimized: batch all bar transforms
        for (let i = 0; i < waveBars.length; i++) {
          const bar = waveBars[i];
          if (!bar) continue;
          const mult = barMultipliers[i] || 0.5;
          // Organic jitter with slight per-bar phase offset
          const jitter = 0.82 + Math.random() * 0.36;
          const scale = Math.max(0.15, Math.min(1.0, 0.15 + (0.85 * factor * mult * jitter)));
          bar.style.transform = `scaleY(${scale.toFixed(3)})`;
        }
      }

      function updateAudioLevel(level) {
        if (!statusPill.classList.contains('visible') || currentState !== 'recording') {
          return;
        }
        // Phase 7: Debounce to single rAF (coalesce rapid audio events)
        pendingAudioLevel = level;
        if (!rafId) {
          rafId = requestAnimationFrame(renderWaveFrame);
        }
      }

      // Immediately display idle badge
      showState('idle');

      window.rift.ready(async () => {
        try {
          const cfgJson = await window.rift.getWidgetConfig();
          const cfg = typeof cfgJson === 'string' ? JSON.parse(cfgJson) : (cfgJson || {});
          widgetVisibility = (cfg.widgetVisibility || cfg.widget_visibility || 'always').toLowerCase();
          lockWidgetPosition = !!(cfg.lockWidgetPosition !== undefined ? cfg.lockWidgetPosition : cfg.lock_widget_position);
          statusPill.classList.toggle('position-locked', lockWidgetPosition);
          applyWidgetStyle(cfg.widgetStyle || cfg.widget_style || cfg.style || 'active_waveform');
          updateKeyDockLabel(cfg);

          if (cfg.inferenceModel || cfg.cloudModel || cfg.sttProvider) {
            updateProcessingModel(cfg.inferenceModel || cfg.cloudModel, cfg.sttProvider);
          }

          if (widgetVisibility === 'always') {
            showState('idle');
          } else {
            hidePillCompletely();
          }
        } catch (err) {
          console.warn('[Widget] Failed to load initial config:', err);
          showState('idle');
        }

        window.rift.on('widgetConfigChanged', (cfgJson) => {
          try {
            const cfg = typeof cfgJson === 'string' ? JSON.parse(cfgJson) : (cfgJson || {});
            widgetVisibility = (cfg.widgetVisibility || cfg.widget_visibility || 'always').toLowerCase();
            statusPill.classList.remove('dragging');
            if (cfg.lockWidgetPosition !== undefined || cfg.lock_widget_position !== undefined) {
              lockWidgetPosition = !!(cfg.lockWidgetPosition !== undefined ? cfg.lockWidgetPosition : cfg.lock_widget_position);
              statusPill.classList.toggle('position-locked', lockWidgetPosition);
            }
            const oldStyle = currentWidgetStyle;
            const newStyle = cfg.widgetStyle || cfg.widget_style || cfg.style;
            if (newStyle) {
              applyWidgetStyle(newStyle);
            }
            updateKeyDockLabel(cfg);
            if (cfg.inferenceModel || cfg.cloudModel || cfg.sttProvider) {
              updateProcessingModel(cfg.inferenceModel || cfg.cloudModel, cfg.sttProvider);
            }

            if (widgetVisibility === 'hidden') {
              hidePillCompletely();
            } else if (widgetVisibility === 'always') {
              if (!isTransientActive()) {
                showState('idle');
              }
            } else if (widgetVisibility === 'recording') {
              if (!isTransientActive()) {
                hidePillCompletely();
              }
            }

            if (oldStyle !== currentWidgetStyle && widgetVisibility !== 'hidden') {
              showState('recording');
              setTimeout(() => {
                transitionToIdleOrHide();
              }, 1600);
            }
          } catch (e) {
            console.error('[Widget] Failed to parse config change:', e);
          }
        });

        window.rift.on('settingsChanged', (settingsRaw) => {
          try {
            const s = typeof settingsRaw === 'string' ? JSON.parse(settingsRaw) : (settingsRaw || {});
            if (s && (s.inferenceModel || s.cloudModel || s.sttProvider)) {
              updateProcessingModel(s.inferenceModel || s.cloudModel, s.sttProvider);
            }
          } catch (e) {}
        });

        window.rift.on('widgetBroughtToFront', () => {
          showState('idle');
          statusPill.classList.add('visible');
          statusPill.style.transform = 'translateY(-2px) scale(1.04)';
          setTimeout(() => {
            statusPill.style.transform = '';
          }, 320);
        });

        window.rift.on('recordingStarted', () => {
          resetWaveBars();
          showState('recording');
        });

        window.rift.on('audioLevel', (level) => {
          updateAudioLevel(level);
        });

        window.rift.on('recordingStopped', (payloadStr) => {
          try {
            const p = typeof payloadStr === 'string' ? JSON.parse(payloadStr) : payloadStr;
            if (p && (p.model || p.provider)) {
              showTranscribingState(p.model, p.provider);
              return;
            }
          } catch (e) {}
          showTranscribingState();
        });

        window.rift.on('recordingCancelled', () => {
          transitionToIdleOrHide();
        });

        window.rift.on('transcriptionProcessing', (payloadStr) => {
          try {
            const p = typeof payloadStr === 'string' ? JSON.parse(payloadStr) : payloadStr;
            if (p) {
              if (p.stage === 'enhancing') {
                showEnhancingState(p.model || 'Formatting...', p.submodel || 'AI Polish');
                return;
              }
              if (p.stage === 'transliterating') {
                showTransliteratingState(p.model, p.provider);
                return;
              }
              showTranscribingState(p.model, p.provider);
              return;
            }
          } catch (e) {}
          showTranscribingState();
        });

        window.rift.on('recordingSaved', (payloadStr) => {
          try {
            const payload = typeof payloadStr === 'string' ? JSON.parse(payloadStr) : payloadStr;
            if (payload && payload.isSilent) {
              warningLabel.textContent = 'No audio';
              showState('warning');
            }
          } catch (err) {
            console.error('[Widget] Error handling recordingSaved:', err);
          }
        });

        window.rift.on('ambientMemoryStarted', () => {
          showTranscribingState('Processing Memory...', 'Groq');
        });

        window.rift.on('ambientMemoryResult', (payloadStr) => {
          try {
            const p = typeof payloadStr === 'string' ? JSON.parse(payloadStr) : payloadStr;
            if (p.error) {
              warningLabel.textContent = p.error;
              showState('warning');
            } else {
              warningLabel.textContent = "Memory Ready! Check Scratchpad.";
              showState('warning');
              if (window.__TAURI__ && window.__TAURI__.core) {
                window.__TAURI__.core.invoke('openScratchpadWindow');
              }
            }
          } catch (e) {
            console.error(e);
          }
          
          setTimeout(() => {
            showState('idle');
          }, 3000);
        });

        window.rift.on('transcriptionSuccess', () => {});

        window.rift.on('transcriptionComplete', (payloadStr) => {
          console.log('[Widget] Received transcriptionComplete:', payloadStr);
        });

        window.rift.on('textInjected', (payloadStr) => {
          console.log('[Widget] Received textInjected:', payloadStr);
          try {
            const data = typeof payloadStr === 'string' ? JSON.parse(payloadStr) : payloadStr;
            if (data && data.method === 'pasted') {
              successLabel.textContent = 'Inserted';
            } else {
              successLabel.textContent = 'Copied';
            }
          } catch (err) {
            successLabel.textContent = 'Inserted';
          }
          showState('success');
        });

        window.rift.on('transcriptionError', (errorStr) => {
          try {
            const payload = typeof errorStr === 'string' ? JSON.parse(errorStr) : errorStr;
            const msg = (payload && payload.message) ? payload.message : 'Transcription error';
            if (payload && payload.canRetry) {
              showRetryState(msg);
              return;
            }
            errorLabel.textContent = msg;
            errorLabel.title = msg;
            showState('error');
          } catch (err) {
            errorLabel.textContent = 'Error';
            showState('error');
          }
        });

        window.rift.on('micError', (errorStr) => {
          try {
            const payload = typeof errorStr === 'string' ? JSON.parse(errorStr) : errorStr;
            const msg = (payload && payload.message) ? payload.message : 'Microphone error';
            errorLabel.textContent = msg;
            errorLabel.title = msg;
            showState('error');
          } catch (err) {
            errorLabel.textContent = 'Mic error';
            showState('error');
          }
        });

        // 1:1 Hardware-Sampled Win32 Window Dragging
        statusPill.addEventListener('mousedown', (e) => {
          if (e.target.closest('#widgetDropdownTrigger') || e.target.closest('#widgetDropdownMenu')) {
            return;
          }
          if (e.button === 0) {
            closeDropdownMenu();
            if (lockWidgetPosition) return;
            statusPill.classList.add('dragging');
            if (window.rift && typeof window.rift.startWidgetDrag === 'function') {
              window.rift.startWidgetDrag();
            }
          }
        });

        window.addEventListener('mouseup', () => {
          statusPill.classList.remove('dragging');
        });

        if (widgetDropdownTrigger) {
          widgetDropdownTrigger.addEventListener('click', toggleDropdownMenu);
          widgetDropdownTrigger.addEventListener('mousedown', (e) => e.stopPropagation());

          widgetDropdownTrigger.addEventListener('mouseenter', () => {
            clearDropdownTimers();
            if (!isDropdownOpen && currentState === 'idle') {
              dropdownHoverTimer = setTimeout(() => {
                openDropdownMenu();
              }, 160);
            }
          });
          widgetDropdownTrigger.addEventListener('mouseleave', () => {
            if (dropdownHoverTimer) {
              clearTimeout(dropdownHoverTimer);
              dropdownHoverTimer = null;
            }
          });
        }

        if (widgetWrapper) {
          widgetWrapper.addEventListener('mouseenter', () => {
            if (dropdownDismissTimer) {
              clearTimeout(dropdownDismissTimer);
              dropdownDismissTimer = null;
            }
          });
          widgetWrapper.addEventListener('mouseleave', () => {
            if (isDropdownOpen) {
              clearDropdownTimers();
              dropdownDismissTimer = setTimeout(() => {
                closeDropdownMenu();
              }, 240);
            }
          });
        }

        if (btnPolish) {
          btnPolish.addEventListener('click', (e) => {
            e.stopPropagation();
            closeDropdownMenu();
            try {
              window.rift.polishSelectedText();
            } catch (err) {
              console.error('[Widget] Failed to invoke polishSelectedText:', err);
            }
          });
          btnPolish.addEventListener('mousedown', (e) => e.stopPropagation());
        }

        if (btnScratchPad) {
          btnScratchPad.addEventListener('click', (e) => {
            e.stopPropagation();
            closeDropdownMenu();
            try {
              window.rift.openScratchpadWindow();
            } catch (err) {
              console.error('[Widget] Failed to invoke openScratchpadWindow:', err);
            }
          });
          btnScratchPad.addEventListener('mousedown', (e) => e.stopPropagation());
        }

        if (btnSpotlight) {
          btnSpotlight.addEventListener('click', (e) => {
            e.stopPropagation();
            closeDropdownMenu();
            try {
              if (window.__TAURI__ && window.__TAURI__.core) {
                window.__TAURI__.core.invoke('openSpotlightWindow');
              }
            } catch (err) {
              console.error('[Widget] Failed to invoke openSpotlightWindow:', err);
            }
          });
          btnSpotlight.addEventListener('mousedown', (e) => e.stopPropagation());
        }

        function triggerRetry() {
          closeDropdownMenu();
          showTranscribingState('Saved Audio', 'groq');
          try {
            if (window.rift && typeof window.rift.retryLastTranscription === 'function') {
              window.rift.retryLastTranscription();
            }
          } catch (e) {
            console.error('[Widget] Failed to invoke retryLastTranscription:', e);
          }
        }

        if (retryActionTag) {
          retryActionTag.addEventListener('click', (e) => {
            e.stopPropagation();
            triggerRetry();
          });
          retryActionTag.addEventListener('mousedown', (e) => e.stopPropagation());
        }

        statusPill.addEventListener('click', (e) => {
          if (currentState === 'retry') {
            if (!e.target.closest('#widgetDropdownTrigger') && !e.target.closest('#widgetDropdownMenu')) {
              e.stopPropagation();
              triggerRetry();
            }
          }
        });

        if (btnRetryAudio) {
          btnRetryAudio.addEventListener('click', (e) => {
            e.stopPropagation();
            triggerRetry();
          });
          btnRetryAudio.addEventListener('mousedown', (e) => e.stopPropagation());
        }

        document.addEventListener('click', (e) => {
          if (isDropdownOpen) {
            const inWrapper = widgetWrapper && widgetWrapper.contains(e.target);
            if (!inWrapper) {
              closeDropdownMenu();
            }
          }
        });
      });
    })();
  </script>
</body>
</html>
