<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rift Floating Status Widget</title>
  <link rel="stylesheet" href="../shared/fonts.css">
  <style>
    /* ============================================================
       CRITICAL TRANSPARENCY & ZERO-SHADE STYLES:
       Compact canvas matching the native Tauri window.
       pointer-events: none ensures mouse clicks pass straight through
       any transparent canvas padding around the centered widget.
       STRICTLY INSET SHADOWS ONLY:
       Prevents any Windows Webview2 alpha-blending or rectangular shades.
       ============================================================ */
    html, body {
      background: transparent !important;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 6px;
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
    }

    body.menu-open-above {
      box-sizing: border-box;
      justify-content: flex-end;
      padding-top: 0;
      padding-bottom: 6px;
    }

    body.menu-open-above .widget-wrapper {
      flex-direction: column-reverse;
    }

    body.menu-open-above .widget-dropdown-menu {
      margin-top: 0;
      margin-bottom: 4px;
    }

    /* ============================================================
       BASE WIDGET CONTAINER (#statusPill)
       Obsidian Dynamic Island floating capsule.
       Morphs seamlessly across all states with continuous 999px radius.
       ============================================================ */
    .pill {
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      pointer-events: none;
      cursor: grab;
      touch-action: none;
      background: #0b0b12; /* Deep Obsidian Surface */
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      box-shadow: 
        inset 0 1px 0 0 rgba(255, 255, 255, 0.16),
        inset 0 -1px 0 0 rgba(0, 0, 0, 0.50) !important;
      opacity: 0;
      transform: translateY(4px) scale(0.95);

      /* Phase 7: Performance — rendering isolation */
      contain: layout style paint;
      will-change: transform, opacity, width, height;

      /* Dynamic Island Liquid-Metal Spring Transition */
      transition: 
        width 170ms cubic-bezier(0.16, 1, 0.3, 1),
        height 170ms cubic-bezier(0.16, 1, 0.3, 1),
        border-color 140ms ease,
        background 140ms ease,
        opacity 140ms ease,
        transform 170ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .pill.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }

    .pill:active,
    .pill.dragging {
      cursor: grabbing !important;
      transform: scale(0.97) rotate(0.4deg);
    }

    .pill.position-locked {
      cursor: default !important;
    }

    /* Phase 6: Hover & Interaction — magnetic lift on idle hover */
    .pill.state-idle:hover {
      transform: translateY(-1px) scale(1.02);
      border-color: rgba(255, 255, 255, 0.14);
    }
    .pill.state-idle:hover .idle-wordmark {
      color: #ffffff;
    }
    .pill.state-idle:hover .idle-presence-dot {
      animation-duration: 1.2s;
    }

    /* ============================================================
       STATE 1: IDLE CAPSULE (Ultra-sleek Minimal 74x21px)
       ============================================================ */
    .pill.state-idle {
      width: 74px;
      height: 21px;
      border-radius: 999px;
      padding: 0 5px;
      background: #0a0a10;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* Ambient idle border glow */
    .pill.state-idle.visible {
      animation: idleAmbientBorder 4s ease-in-out infinite alternate;
    }
    @keyframes idleAmbientBorder {
      0% { border-color: rgba(255, 255, 255, 0.06); }
      50% { border-color: rgba(129, 140, 248, 0.18); }
      100% { border-color: rgba(192, 132, 252, 0.14); }
    }

    /* ============================================================
       ACTIVE BASE & STATES (Height: 21px, continuous capsule)
       ============================================================ */
    .pill.state-active {
      height: 21px;
      border-radius: 999px;
      padding: 0 5px;
    }

    /* Active Recording State: 98px width */
    .pill.recording-active {
      width: 98px;
      border-color: rgba(139, 92, 246, 0.65);
      background: #0d0c18;
      box-shadow: 
        inset 0 1px 0 0 rgba(167, 139, 250, 0.25),
        inset 0 -1px 0 0 rgba(0, 0, 0, 0.50) !important;
      animation: recordingBorderPulse 2s ease-in-out infinite alternate !important;
    }

    @keyframes recordingBorderPulse {
      0% { border-color: rgba(139, 92, 246, 0.45); }
      100% { border-color: rgba(167, 139, 250, 0.85); }
    }

    /* Processing State: Adaptive width based on selected transcribing style (height strictly 21px) */
    .pill.state-processing-active {
      width: 58px;
      border-color: rgba(129, 140, 248, 0.58);
      background: #0b0b13;
      box-shadow: 
        inset 0 1px 0 0 rgba(129, 140, 248, 0.24),
        inset 0 -1px 0 0 rgba(0, 0, 0, 0.50) !important;
      animation: processingBorderBreathe 1.8s ease-in-out infinite alternate;
    }

    /* Enhancing State */
    .pill.state-enhancing-active {
      width: 58px;
      border-color: rgba(192, 132, 252, 0.68) !important;
      background: #0d0a16 !important;
      box-shadow: 
        inset 0 1px 0 0 rgba(192, 132, 252, 0.28),
        inset 0 -1px 0 0 rgba(0, 0, 0, 0.50) !important;
      animation: enhancingBorderBreathe 1.5s ease-in-out infinite alternate !important;
    }

    .pill.tstyle-orbit_pure.state-processing-active,
    .pill.tstyle-orbit_pure.state-enhancing-active {
      width: 58px;
    }

    .pill.tstyle-orbit_badge.state-processing-active,
    .pill.tstyle-orbit_badge.state-enhancing-active {
      width: 88px;
    }

    .pill.tstyle-harmonic_wave.state-processing-active,
    .pill.tstyle-harmonic_wave.state-enhancing-active {
      width: 68px;
    }

    .pill.tstyle-infinity_pulse.state-processing-active,
    .pill.tstyle-infinity_pulse.state-enhancing-active {
      width: 72px;
    }

    @keyframes processingBorderBreathe {
      0% { border-color: rgba(99, 102, 241, 0.42); }
      100% { border-color: rgba(129, 140, 248, 0.82); }
    }

    @keyframes enhancingBorderBreathe {
      0% { border-color: rgba(168, 85, 247, 0.45); }
      100% { border-color: rgba(216, 180, 254, 0.85); }
    }

    /* Success Pill: 54px width (Sleek minimal Done animation, no text) */
    .pill.state-success-active {
      width: 54px;
      border-color: rgba(52, 211, 153, 0.65);
      background: #07120e;
      box-shadow: 
        inset 0 1px 0 0 rgba(52, 211, 153, 0.28),
        inset 0 -1px 0 0 rgba(0, 0, 0, 0.50) !important;
      animation: successFlash 420ms cubic-bezier(0.16, 1, 0.3, 1) !important;
    }

    @keyframes successFlash {
      0% { border-color: rgba(110, 231, 183, 0.95); }
      100% { border-color: rgba(52, 211, 153, 0.55); }
    }

    /* Warning Pill: 94px width */
    .pill.state-warning-active {
      width: 94px;
      border-color: rgba(251, 191, 36, 0.65);
      background: #141006;
      box-shadow: 
        inset 0 1px 0 0 rgba(251, 191, 36, 0.25),
        inset 0 -1px 0 0 rgba(0, 0, 0, 0.50) !important;
    }

    /* Error Pill: 94px width */
    .pill.state-error-active {
      width: 94px;
      border-color: rgba(239, 68, 68, 0.65);
      background: #160808;
      box-shadow: 
        inset 0 1px 0 0 rgba(239, 68, 68, 0.25),
        inset 0 -1px 0 0 rgba(0, 0, 0, 0.50) !important;
    }

    /* Retry Audio Recovery: 98px width */
    .pill.state-retry-active {
      width: 98px;
      border-color: rgba(245, 158, 11, 0.55) !important;
      background: #151108 !important;
      box-shadow: 
        inset 0 1px 0 0 rgba(245, 158, 11, 0.3),
        inset 0 -1px 0 0 rgba(0, 0, 0, 0.50) !important;
      animation: amberBreathe 2.8s ease-in-out infinite alternate !important;
      cursor: pointer !important;
    }

    .pill.state-retry-active:hover {
      border-color: rgba(245, 158, 11, 0.85) !important;
      transform: scale(1.02);
    }

    @keyframes amberBreathe {
      0% {
        border-color: rgba(245, 158, 11, 0.4);
      }
      100% {
        border-color: rgba(245, 158, 11, 0.8);
      }
    }

    /* ============================================================
       CONTENT LAYERS & CROSS-FADE
       ============================================================ */
    .badge-content {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 8px;
      box-sizing: border-box;
      opacity: 1;
      transform: scale(1);
      transition: opacity 140ms ease-out, transform 160ms ease-out;
      pointer-events: auto;
    }

    .active-content {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 8px;
      box-sizing: border-box;
      opacity: 0;
      transform: scale(0.92);
      transition: opacity 160ms ease-out, transform 180ms cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    .pill.state-idle .badge-content {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }
    .pill.state-idle .active-content {
      opacity: 0;
      transform: scale(0.92);
      pointer-events: none;
    }

    .pill.state-active .badge-content {
      opacity: 0;
      transform: scale(0.88);
      pointer-events: none;
    }
    .pill.state-active .active-content {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    /* ============================================================
       IDLE BADGE DETAILS
       16px Logo Chip + Wordmark + Glowing Presence Pip
       ============================================================ */
    .idle-logo-chip {
      position: relative;
      width: 13px;
      height: 13px;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .idle-logo-svg {
      width: 13px;
      height: 13px;
      display: block;
    }

    .idle-wordmark {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 9px;
      font-weight: 700;
      color: #cbd5e1;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-left: 4px;
      line-height: 1;
      white-space: nowrap;
      transition: color 200ms ease;
    }

    .idle-presence-dot {
      width: 3.5px;
      height: 3.5px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 
        0 0 3px rgba(16, 185, 129, 0.6),
        0 0 6px rgba(16, 185, 129, 0.3);
      margin-left: 4px;
      flex-shrink: 0;
      animation: presenceBreathe 3s ease-in-out infinite alternate;
      transition: animation-duration 300ms ease;
    }

    @keyframes presenceBreathe {
      0% { opacity: 0.4; transform: scale(0.8); box-shadow: 0 0 3px rgba(16,185,129,0.4); }
      100% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 6px rgba(16,185,129,0.8), 0 0 12px rgba(16,185,129,0.3); }
    }

    /* Wrapper containing both the floating pill and the external dropdown */
    .widget-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      position: relative;
      width: 100%;
      pointer-events: none;
    }

    /* Dropdown Trigger Arrow Button */
    .dropdown-trigger-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 1px solid transparent;
      outline: none;
      padding: 0;
      width: 0;
      height: 14px;
      margin-left: 0;
      opacity: 0;
      cursor: pointer;
      color: #94a3b8;
      border-radius: 4px;
      overflow: hidden;
      pointer-events: none;
      flex-shrink: 0;
      transition: width 140ms cubic-bezier(0.16, 1, 0.3, 1),
                  opacity 140ms ease,
                  margin-left 140ms ease,
                  background 120ms ease,
                  border-color 120ms ease,
                  color 120ms ease,
                  transform 120ms ease;
    }

    /* Hovering over idle pill reveals the sleek chevron button */
    .pill.state-idle:hover .dropdown-trigger-btn,
    .pill.state-idle.dropdown-open .dropdown-trigger-btn,
    .widget-wrapper:hover .dropdown-trigger-btn {
      width: 14px;
      height: 14px;
      margin-left: 4px;
      opacity: 0.85;
      background: #1a1a27;
      border-color: #2b2b3d;
      color: #a5b4fc;
      pointer-events: auto;
    }

    .dropdown-trigger-btn:hover {
      opacity: 1 !important;
      color: #c084fc !important;
      background: #27193d !important;
      border-color: #6d4dc7 !important;
      transform: scale(1.06);
    }

    .dropdown-chevron-svg {
      width: 8.5px;
      height: 8.5px;
      display: block;
      transition: transform 180ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .pill.dropdown-open .dropdown-chevron-svg {
      transform: rotate(180deg);
      color: #c084fc;
    }

    /* Phase 3: Premium Frosted Glass Dropdown */
    .widget-dropdown-menu {
      box-sizing: border-box;
      width: 118px;
      margin-top: 4px;
      background: rgba(10, 10, 16, 0.96);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 8px;
      padding: 2px;
      display: flex;
      flex-direction: column;
      gap: 1.5px;
      box-shadow: 
        inset 0 1px 0 0 rgba(255, 255, 255, 0.14),
        0 8px 24px rgba(0, 0, 0, 0.6) !important;
      opacity: 0;
      transform: translateY(-5px) scale(0.94);
      pointer-events: none;
      transition: opacity 160ms ease-out, transform 180ms cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1000;
    }

    .widget-dropdown-menu.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    /* Phase 3: Staggered menu item reveal */
    .widget-dropdown-menu .menu-action-item {
      opacity: 0;
      transform: translateY(-5px);
      transition: opacity 100ms ease-out, transform 140ms cubic-bezier(0.34, 1.56, 0.64, 1), background 120ms ease, color 120ms ease;
    }
    .widget-dropdown-menu.open .menu-action-item:nth-child(1) { opacity: 1; transform: translateY(0); transition-delay: 15ms; }
    .widget-dropdown-menu.open .menu-action-item:nth-child(2) { opacity: 1; transform: translateY(0); transition-delay: 40ms; }
    .widget-dropdown-menu.open .menu-action-item:nth-child(3) { opacity: 1; transform: translateY(0); transition-delay: 65ms; }
    .widget-dropdown-menu.open .menu-action-item:nth-child(4) { opacity: 1; transform: translateY(0); transition-delay: 90ms; }

    .menu-action-item {
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 25px;
      padding: 0 6px;
      background: transparent;
      border: none;
      border-radius: 5px;
      color: #e2e8f0;
      font-family: inherit;
      cursor: pointer;
      transition: background 120ms ease, color 120ms ease, transform 90ms ease;
      user-select: none;
      -webkit-user-select: none;
      position: relative;
    }

    .menu-action-item:active {
      transform: scale(0.97);
    }

    .menu-action-item.retry-item:hover {
      background: rgba(245, 158, 11, 0.16) !important;
      color: #fef3c7 !important;
    }

    .menu-action-item.retry-item:hover .menu-item-hint {
      color: #fbbf24 !important;
    }

    .menu-item-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .menu-item-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .menu-item-icon svg {
      width: 12px;
      height: 12px;
    }

    .menu-item-label {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .menu-item-hint {
      font-size: 8.5px;
      color: #64748b;
      font-family: ui-monospace, SFMono-Regular, monospace;
    }

    .polish-item:hover {
      background: #241738;
      color: #f3e8ff;
    }
    .polish-item:hover .menu-item-icon svg {
      color: #c084fc;
    }
    .polish-item:hover .menu-item-hint {
      color: #d8b4fe;
    }

    .scratch-item:hover {
      background: #191c34;
      color: #e0e7ff;
    }
    .scratch-item:hover .menu-item-icon svg {
      color: #818cf8;
    }
    .scratch-item:hover .menu-item-hint {
      color: #a5b4fc;
    }

    .spotlight-item:hover {
      background: #251739;
      color: #f3e8ff;
    }
    .spotlight-item:hover .menu-item-icon svg {
      color: #c084fc;
    }
    .spotlight-item:hover .menu-item-hint {
      color: #e9d5ff;
    }

    /* ============================================================
       ACTIVE STATE VIEWS
       ============================================================ */
    .state-view {
      display: none;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 100%;
      color: #F1F5F9;
      box-sizing: border-box;
    }

    .state-view.active {
      display: flex;
    }

    /* ============================================================
       RECORDING STATE (GPU Waveform & Live Timer)
       ============================================================ */
    .mic-chip {
      width: 13.5px;
      height: 13.5px;
      border-radius: 50%;
      background: #7c5cfa;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 75ms ease-out;
    }

    .mic-icon-svg {
      width: 7.5px;
      height: 7.5px;
      color: #ffffff;
    }

    /* Crisp Minimal 4-Bar Audio Equalizer (Zero blur, retina-sharp) */
    .equalizer-bars {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      height: 12px;
      margin: 0 3px;
    }
    .eq-bar {
      width: 1.8px;
      height: 3px;
      min-height: 2.5px;
      max-height: 11px;
      border-radius: 999px;
      transition: height 50ms cubic-bezier(0.16, 1, 0.3, 1);
      will-change: height;
    }
    .eq-bar-1 { height: 3px; background: #818cf8; }
    .eq-bar-2 { height: 5px; background: #a78bfa; }
    .eq-bar-3 { height: 6px; background: #c084fc; }
    .eq-bar-4 { height: 4px; background: #38bdf8; }

    .rec-indicator {
      display: flex;
      align-items: center;
      gap: 2.5px;
      flex-shrink: 0;
    }

    .rec-dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #f43f5e;
      animation: recPulse 1.2s ease-in-out infinite;
    }

    @keyframes recPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.8); }
    }

    .rec-timer {
      font-size: 8px;
      font-weight: 600;
      color: #cbd5e1;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: 0.02em;
    }

    /* Key Dock badge adaptation */
    .key-dock-badge {
      display: none;
      align-items: center;
      justify-content: center;
      background: #1e1e2d;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 3px;
      padding: 1px 4px;
      font-size: 8px;
      font-weight: 700;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      flex-shrink: 0;
    }
    .pill.style-key_dock .key-dock-badge {
      display: inline-flex;
    }
    .pill.style-key_dock.recording-active .key-dock-badge {
      color: #fee2e2;
      background: #991b1b;
      border-color: #ef4444;
    }

    /* ============================================================
       PROCESSING STATE (4 Selectable Flagship Transcribing Animations)
       1. orbit_pure:     16px Dual-Orbit Liquid Ring (Icon-Only, matches Done 1:1)
       2. orbit_badge:    15.5px Dual-Orbit Ring + Horizontal Micro Model Chip
       3. harmonic_wave:  5-Bar 15px Harmonic Liquid Sine-Wave
       4. infinity_pulse: 32x14px Stadium Comet Track + Breathing Core Star
       ============================================================ */
    .state-view-processing {
      display: none;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }
    .state-view-processing.active {
      display: flex;
    }

    .processing-content-column {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: 0 2px;
      gap: 5.5px;
    }

    .processing-loading-icon {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      line-height: 1;
      flex-shrink: 0;
    }

    /* Dual-Orbit Ring SVG (16px x 16px — prominent, razor-sharp, full capsule height) */
    .processing-spinner {
      width: 16px;
      height: 16px;
      display: block;
      filter: drop-shadow(0 0 3.5px rgba(56, 189, 248, 0.5));
    }

    .orbit-outer-group {
      transform-origin: 12px 12px;
      animation: spinClockwise 740ms linear infinite;
    }

    .orbit-inner-group {
      transform-origin: 12px 12px;
      animation: spinCounterClockwise 1080ms linear infinite;
    }

    .orbit-core-dot {
      transform-origin: 12px 12px;
      animation: coreBreathe 900ms ease-in-out infinite alternate;
    }

    @keyframes spinClockwise {
      to { transform: rotate(360deg); }
    }

    @keyframes spinCounterClockwise {
      to { transform: rotate(-360deg); }
    }

    @keyframes coreBreathe {
      0% { transform: scale(0.75); opacity: 0.65; }
      100% { transform: scale(1.2); opacity: 1; }
    }

    .enhancing-sparkle {
      width: 15.5px;
      height: 15.5px;
      display: none;
      animation: sparklePulse 1.0s ease-in-out infinite;
    }

    .pill.state-enhancing-active .enhancing-sparkle {
      display: block;
    }

    .pill.state-enhancing-active .processing-spinner {
      display: none;
    }

    /* Horizontal Micro-Badge for orbit_badge mode */
    .processing-model-label {
      display: none;
      align-items: center;
      justify-content: center;
      color: #e0e7ff;
      background: rgba(129, 140, 248, 0.14);
      border: 1px solid rgba(129, 140, 248, 0.30);
      border-radius: 999px;
      padding: 1.5px 5px;
      font-size: 6.5px;
      font-weight: 800;
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      white-space: nowrap;
      line-height: 1;
      flex-shrink: 0;
    }

    .pill.tstyle-orbit_badge .processing-model-label {
      display: inline-flex;
    }

    .pill.state-enhancing-active .processing-model-label {
      color: #f3e8ff;
      background: rgba(192, 132, 252, 0.16);
      border-color: rgba(192, 132, 252, 0.36);
    }

    /* Style 3: 5-Bar Harmonic Liquid Sine-Wave (15px tall bars, GPU scaleY from centerline) */
    .processing-harmonic-wave {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 3px;
      width: 28px;
      height: 16px;
      flex-shrink: 0;
    }

    .hw-bar {
      width: 2.6px;
      border-radius: 999px;
      transform-origin: center center;
      animation: harmonicWaveScale 680ms ease-in-out infinite;
      will-change: transform, opacity;
      flex-shrink: 0;
    }
    .hw-bar:nth-child(1) {
      height: 11px;
      background: linear-gradient(180deg, #818cf8 0%, #6366f1 100%);
      animation-delay: 0ms;
    }
    .hw-bar:nth-child(2) {
      height: 13.5px;
      background: linear-gradient(180deg, #38bdf8 0%, #818cf8 100%);
      animation-delay: -135ms;
    }
    .hw-bar:nth-child(3) {
      height: 15px;
      background: linear-gradient(180deg, #6ee7b7 0%, #38bdf8 55%, #818cf8 100%);
      filter: drop-shadow(0 0 3.5px rgba(56, 189, 248, 0.55));
      animation-delay: -270ms;
    }
    .hw-bar:nth-child(4) {
      height: 13.5px;
      background: linear-gradient(180deg, #c084fc 0%, #38bdf8 100%);
      animation-delay: -405ms;
    }
    .hw-bar:nth-child(5) {
      height: 11px;
      background: linear-gradient(180deg, #34d399 0%, #38bdf8 100%);
      animation-delay: -540ms;
    }

    @keyframes harmonicWaveScale {
      0%, 100% {
        transform: scaleY(0.34);
        opacity: 0.62;
      }
      50% {
        transform: scaleY(1);
        opacity: 1;
      }
    }

    /* Style 4: Stadium Comet Track + Breathing Star Core (34x15px, exact pathLength=100) */
    .processing-infinity-pulse {
      display: none;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 15px;
      position: relative;
      flex-shrink: 0;
    }

    .infinity-track-svg {
      width: 34px;
      height: 15px;
      display: block;
      overflow: visible;
      filter: drop-shadow(0 0 3.5px rgba(56, 189, 248, 0.48));
    }

    .infinity-comet-rect {
      stroke-dasharray: 32 68;
      stroke-dashoffset: 100;
      animation: cometRacePrimary 880ms linear infinite;
    }

    .infinity-comet-rect-secondary {
      stroke-dasharray: 18 82;
      stroke-dashoffset: 50;
      animation: cometRaceSecondary 880ms linear infinite;
    }

    @keyframes cometRacePrimary {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes cometRaceSecondary {
      0% { stroke-dashoffset: 50; }
      100% { stroke-dashoffset: -50; }
    }

    .infinity-center-star {
      transform-origin: 18px 8px;
      filter: drop-shadow(0 0 4px rgba(110, 231, 183, 0.9));
      animation: coreBreathe 720ms ease-in-out infinite alternate;
    }

    /* Visibility switching across the 4 transcribing styles */
    .pill.tstyle-harmonic_wave:not(.state-enhancing-active) .processing-loading-icon,
    .pill.tstyle-harmonic_wave .processing-model-label,
    .pill.tstyle-harmonic_wave .processing-infinity-pulse {
      display: none !important;
    }
    .pill.tstyle-harmonic_wave:not(.state-enhancing-active) .processing-harmonic-wave {
      display: flex !important;
    }

    .pill.tstyle-infinity_pulse:not(.state-enhancing-active) .processing-loading-icon,
    .pill.tstyle-infinity_pulse .processing-model-label,
    .pill.tstyle-infinity_pulse .processing-harmonic-wave {
      display: none !important;
    }
    .pill.tstyle-infinity_pulse:not(.state-enhancing-active) .processing-infinity-pulse {
      display: flex !important;
    }

    @keyframes sparklePulse {
      0%, 100% {
        transform: scale(0.92);
        opacity: 0.85;
        filter: drop-shadow(0 0 3px rgba(192, 132, 252, 0.5));
      }
      50% {
        transform: scale(1.1);
        opacity: 1;
        filter: drop-shadow(0 0 6px rgba(216, 180, 254, 0.85));
      }
    }

    /* ============================================================
       SUCCESS, WARNING & ERROR STATES
       ============================================================ */
    .state-chip {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .state-view-success {
      display: none;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }
    .state-view-success.active {
      display: flex;
    }

    .success-done-pill {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    .done-minimal-wrap {
      position: relative;
      width: 14px;
      height: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .done-halo-ring {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1px solid #34d399;
      opacity: 0;
      pointer-events: none;
    }

    .state-view-success.active .done-halo-ring {
      animation: doneHaloRipple 460ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes doneHaloRipple {
      0% {
        opacity: 0.75;
        transform: scale(0.55);
      }
      100% {
        opacity: 0;
        transform: scale(1.75);
      }
    }

    .done-tick-svg {
      width: 13px;
      height: 13px;
      display: block;
      filter: drop-shadow(0 0 3.5px rgba(52, 211, 153, 0.45));
      transform: scale(0.84);
      opacity: 0;
    }

    .state-view-success.active .done-tick-svg {
      animation: doneSvgScaleIn 260ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes doneSvgScaleIn {
      0% {
        opacity: 0;
        transform: scale(0.82);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .done-tick-svg path {
      stroke-dasharray: 22;
      stroke-dashoffset: 22;
    }

    .state-view-success.active .done-tick-svg path {
      animation: checkStrokeDraw 280ms cubic-bezier(0.22, 1, 0.36, 1) 35ms forwards;
    }

    .state-chip.warning {
      background: #451a03;
      border: 1px solid #d97706;
      color: #fbbf24;
    }

    .state-chip.error {
      background: #450a0a;
      border: 1px solid #dc2626;
      color: #ef4444;
    }

    .state-view.active .flourish-icon {
      animation: iconFlourish 280ms cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes iconFlourish {
      0% {
        opacity: 0;
        transform: scale(0.4) rotate(-8deg);
      }
      60% {
        opacity: 1;
        transform: scale(1.12) rotate(2deg);
      }
      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    @keyframes checkStrokeDraw {
      0% { stroke-dashoffset: 22; }
      100% { stroke-dashoffset: 0; }
    }

    .state-text-wrapper {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-left: 6px;
      flex: 1;
      overflow: hidden;
    }

    .state-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 85px;
      line-height: 1.1;
    }

    .state-title.success { color: #34d399; }
    .state-title.warning { color: #fbbf24; }
    .state-title.error   { color: #f87171; }

    .state-chip.retry {
      width: 18px;
      height: 18px;
      background: #241604;
      border: 1px solid rgba(245, 158, 11, 0.45);
      color: #fbbf24;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .retry-text-wrapper {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-left: 6px;
      flex: 1;
      overflow: hidden;
      justify-content: center;
    }

    .state-title.retry {
      color: #fef3c7;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: -0.01em;
      line-height: 1.1;
    }

    .retry-action-tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(245, 158, 11, 0.16);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fef3c7;
      border-radius: 999px;
      padding: 2px 6px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.02em;
      margin-left: 5px;
      flex-shrink: 0;
      transition: all 140ms ease;
      white-space: nowrap;
    }

    .pill.state-retry-active:hover .retry-action-tag {
      background: rgba(245, 158, 11, 0.32);
      border-color: rgba(245, 158, 11, 0.75);
      color: #ffffff;
      transform: scale(1.04);
    }

    .state-subtitle {
      font-size: 8.5px;
      color: #94a3b8;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    /* Style variants: pill_text vs icon_color vs icon_mono */
    .pill.state-idle.style-icon_color,
    .pill.state-idle.style-icon_mono {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      padding: 0;
      justify-content: center;
    }
    .pill.state-idle.style-icon_color .idle-wordmark,
    .pill.state-idle.style-icon_mono .idle-wordmark,
    .pill.state-idle.style-icon_color .idle-presence-dot,
    .pill.state-idle.style-icon_mono .idle-presence-dot {
      display: none;
    }
    .pill.style-icon_mono .idle-logo-chip svg {
      filter: grayscale(100%) opacity(0.85);
    }

  </style>

  <script src="../shared/qwebchannel.js"></script>
  <script src="../shared/bridge.js"></script>
</head>
<body>
  <div class="widget-wrapper" id="widgetWrapper">
    <div id="statusPill" class="pill state-idle">

      <!-- ============================================================
           1. IDLE BADGE CONTENT (16px Logo Chip + Wordmark + Presence Dot)
           ============================================================ -->
      <div id="idleBadgeContent" class="badge-content">
        <div class="idle-logo-chip">
          <svg viewBox="0 0 48 48" class="idle-logo-svg" fill="none">
            <defs>
              <linearGradient id="riftGradIdle" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#c084fc" />
                <stop offset="50%" stop-color="#818cf8" />
                <stop offset="100%" stop-color="#38bdf8" />
              </linearGradient>
            </defs>
            <rect x="3" y="3" width="42" height="42" rx="11" fill="#161622" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
            <path d="M14 12C14 10.8954 14.8954 10 16 10H25C29.4183 10 33 13.5817 33 18C33 21.8427 30.2872 25.0494 26.6575 25.8123L33.4 35.8C33.9523 36.5364 33.4269 37.6 32.5 37.6H28.4C27.8 37.6 27.2 37.3 26.8 36.8L21 28.5H19V36.5C19 37.0523 18.5523 37.5 18 37.5H15C14.4477 37.5 14 37.0523 14 36.5V12Z" fill="url(#riftGradIdle)" />
            <path d="M19 15.5H24.5C26.1569 15.5 27.5 16.8431 27.5 18.5C27.5 20.1569 26.1569 21.5 24.5 21.5H19V15.5Z" fill="#161622" />
            <circle cx="36" cy="14" r="2.5" fill="#45dfa9" />
          </svg>
        </div>
        <span class="idle-wordmark">Rift</span>
        <div class="idle-presence-dot"></div>
        <button id="widgetDropdownTrigger" class="dropdown-trigger-btn" type="button" title="Quick Actions" aria-label="Quick Actions">
          <svg class="dropdown-chevron-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
      </div>

      <!-- ============================================================
           2. ACTIVE PILL CONTENT
           ============================================================ -->
      <div id="activeContent" class="active-content">

        <!-- View: Recording -->
        <div id="stateRecording" class="state-view">
          <div class="mic-chip" id="micChip">
            <svg class="mic-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
              <line x1="12" y1="19" x2="12" y2="23"></line>
              <line x1="8" y1="23" x2="16" y2="23"></line>
            </svg>
          </div>
          <div class="equalizer-bars" id="equalizerBars">
            <div class="eq-bar eq-bar-1" id="eqBar1"></div>
            <div class="eq-bar eq-bar-2" id="eqBar2"></div>
            <div class="eq-bar eq-bar-3" id="eqBar3"></div>
            <div class="eq-bar eq-bar-4" id="eqBar4"></div>
          </div>
          <div class="key-dock-badge" id="keyDockBadge">ALT</div>
          <div class="rec-indicator">
            <div class="rec-dot"></div>
            <span class="rec-timer" id="recTimer">0:00</span>
          </div>
        </div>

        <!-- View: Processing / Enhancing (Supports 4 Flagship Transcribing Styles) -->
        <div id="stateProcessing" class="state-view state-view-processing">
          <div class="processing-content-column">
            <div class="processing-loading-icon" id="processingLoadingIcon">
              <!-- Style 1 & 2: Dual-Orbit Liquid Ring (16px x 16px) -->
              <svg class="processing-spinner" id="processingSpinner" viewBox="0 0 24 24" fill="none">
                <defs>
                  <linearGradient id="procOrbitOuterGrad" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="#a5b4fc" />
                    <stop offset="50%" stop-color="#38bdf8" />
                    <stop offset="100%" stop-color="#34d399" />
                  </linearGradient>
                  <linearGradient id="procOrbitInnerGrad" x1="20" y1="4" x2="4" y2="20" gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="#c084fc" />
                    <stop offset="100%" stop-color="#818cf8" />
                  </linearGradient>
                </defs>
                <!-- Subtle ambient track -->
                <circle cx="12" cy="12" r="9.5" stroke="rgba(129, 140, 248, 0.15)" stroke-width="2.2"></circle>
                <!-- Outer clockwise liquid comet arc -->
                <g class="orbit-outer-group">
                  <path d="M12 2.5A9.5 9.5 0 0 1 21.5 12" stroke="url(#procOrbitOuterGrad)" stroke-width="2.5" stroke-linecap="round"></path>
                </g>
                <!-- Inner counter-rotating harmonic arc -->
                <g class="orbit-inner-group">
                  <path d="M12 18.2A6.2 6.2 0 0 1 5.8 12" stroke="url(#procOrbitInnerGrad)" stroke-width="1.9" stroke-linecap="round"></path>
                </g>
                <!-- Center breathing energy core -->
                <circle class="orbit-core-dot" cx="12" cy="12" r="2.1" fill="#38bdf8"></circle>
              </svg>

              <!-- Enhancing Sparkle Icon -->
              <svg class="enhancing-sparkle" id="enhancingSparkle" viewBox="0 0 24 24" fill="none" stroke="#c084fc" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/>
              </svg>
            </div>

            <!-- Style 3: 5-Bar Harmonic Liquid Sine-Wave (15px tall peak, sibling of #processingLoadingIcon) -->
            <div class="processing-harmonic-wave" id="processingHarmonicWave">
              <div class="hw-bar"></div>
              <div class="hw-bar"></div>
              <div class="hw-bar"></div>
              <div class="hw-bar"></div>
              <div class="hw-bar"></div>
            </div>

            <!-- Style 4: Stadium Comet Track + Core Pulse (34px x 15px, sibling of #processingLoadingIcon) -->
            <div class="processing-infinity-pulse" id="processingInfinityPulse">
              <svg class="infinity-track-svg" viewBox="0 0 36 16" fill="none">
                <defs>
                  <linearGradient id="procInfinityGrad" x1="0" y1="0" x2="36" y2="16" gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="#6ee7b7" />
                    <stop offset="50%" stop-color="#38bdf8" />
                    <stop offset="100%" stop-color="#c084fc" />
                  </linearGradient>
                </defs>
                <!-- Ambient stadium loop track -->
                <rect x="2" y="2" width="32" height="12" rx="6" stroke="rgba(129, 140, 248, 0.18)" stroke-width="2"></rect>
                <!-- Secondary harmonic chasing comet -->
                <rect class="infinity-comet-rect-secondary" x="2" y="2" width="32" height="12" rx="6" pathLength="100" stroke="url(#procInfinityGrad)" stroke-width="1.8" stroke-linecap="round" opacity="0.65"></rect>
                <!-- Primary racing liquid comet -->
                <rect class="infinity-comet-rect" x="2" y="2" width="32" height="12" rx="6" pathLength="100" stroke="url(#procInfinityGrad)" stroke-width="2.3" stroke-linecap="round"></rect>
                <!-- Center breathing energy star (mathematically centered at 18, 8) -->
                <circle class="infinity-center-star" cx="18" cy="8" r="2.2" fill="#6ee7b7"></circle>
              </svg>
            </div>

            <!-- Style 2 Horizontal Frosted Micro-Badge -->
            <span class="processing-model-label" id="processingModelLabel">SCRIBE</span>
          </div>
          <span id="processingTitle" style="display: none;"></span>
        </div>

        <!-- View: Success (Sleek, minimal Done animation: standalone emerald checkmark + halo ripple) -->
        <div id="stateSuccess" class="state-view state-view-success">
          <div class="success-done-pill">
            <div class="done-minimal-wrap">
              <div class="done-halo-ring"></div>
              <svg class="done-tick-svg" viewBox="0 0 24 24" fill="none">
                <defs>
                  <linearGradient id="doneEmeraldGrad" x1="4" y1="12" x2="20" y2="6" gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="#6ee7b7" />
                    <stop offset="100%" stop-color="#10b981" />
                  </linearGradient>
                </defs>
                <path d="M4.5 12.5L9.5 17.5L19.5 6.5" stroke="url(#doneEmeraldGrad)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </div>
          </div>
          <span id="successLabel" style="display: none;">Inserted</span>
        </div>

        <!-- View: Warning -->
        <div id="stateWarning" class="state-view">
          <div class="state-chip warning flourish-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width: 11px; height: 11px;">
              <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
              <line x1="12" y1="9" x2="12" y2="13"></line>
              <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
          </div>
          <div class="state-text-wrapper">
            <span class="state-title warning" id="warningLabel">No audio</span>
            <span class="state-subtitle">Try again</span>
          </div>
        </div>

        <!-- View: Error -->
        <div id="stateError" class="state-view">
          <div class="state-chip error flourish-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width: 11px; height: 11px;">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="15" y1="9" x2="9" y2="15"></line>
              <line x1="9" y1="9" x2="15" y2="15"></line>
            </svg>
          </div>
          <div class="state-text-wrapper">
            <span class="state-title error" id="errorLabel">Mic error</span>
            <span class="state-subtitle">Permissions</span>
          </div>
        </div>

        <!-- View: Retry Audio Recovery -->
        <div id="stateRetry" class="state-view">
          <div class="state-chip retry flourish-icon" id="retryChip">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="width: 10px; height: 10px;">
              <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
            </svg>
          </div>
          <div class="state-text-wrapper retry-text-wrapper" id="retryActionArea">
            <span class="state-title retry" id="retryLabel">Audio Saved</span>
          </div>
          <div class="retry-action-tag" id="retryActionTag" title="Click to transcribe saved audio">
            <span>Retry ↻</span>
          </div>
        </div>
      </div> <!-- Closes activeContent -->

    </div> <!-- Closes statusPill -->

    <!-- ============================================================
         3. COMPACT OBSIDIAN ACTIONS DROPDOWN MENU
         ============================================================ -->
    <div id="widgetDropdownMenu" class="widget-dropdown-menu">
      <button id="btnPolish" class="menu-action-item polish-item" type="button" title="Enhance selected text in current application">
        <div class="menu-item-left">
          <div class="menu-item-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/>
            </svg>
          </div>
          <span class="menu-item-label">Polish</span>
        </div>

        <div class="menu-item-left">

              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>

        <div class="menu-item-left">

              <circle cx="12" cy="12" r="10"></circle>

        <div class="menu-item-left">
          <div class="menu-item-icon" style="color: #fbbf24;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
