name: Build macOS App (.dmg)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

jobs:
  build-macos:
    name: Build macOS (${{ matrix.arch_name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
            arch_name: AppleSilicon-M-Series
          - target: x86_64-apple-darwin
            runner: macos-13
            arch_name: Intel-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install root dependencies
        run: npm ci || npm install

      - name: Install and build React frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          cd frontend
          npm ci || npm install
          npm run build
          cd ..

      - name: Build macOS DMG Bundle
        run: npx @tauri-apps/cli build --target ${{ matrix.target }}

      - name: Upload DMG Installer
        uses: actions/upload-artifact@v4
        with:
          name: Rift-${{ matrix.arch_name }}-DMG
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn
